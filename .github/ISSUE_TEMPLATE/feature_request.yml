name: 💡 Feature request / evolution
description: Suggest a new feature or a change in behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: What would you like OpenPorte to do (or do differently)?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would this help you?
      description: Optional, but context helps us prioritize.
    validations:
      required: false
