name: Bug report
description: Report a reproducible bug in OpenPorte
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        - For a **security vulnerability**, please don't use this form — see [SECURITY.md](https://github.com/openporte/openporte/security/policy) instead.
        - If you're **not sure** whether this is a bug or just need help, please ask on the [support forum](https://wordpress.org/support/plugin/openporte/) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenPorte version
      description: |
        - Use *n/a* for not applicable or *unknown* if you do not know it.
        - You can find it in the Admin area of WordPress under Plugins.
      placeholder: "ex. v1.27.2 or 1.28.0"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      description: |
        - Use *n/a* for not applicable or *unknown* if you do not know it.
        - You can find it in the Admin area of WordPress. Ex: under Tools → Site Health, and then Info.
      placeholder: "ex. 7.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: |
        - Use *n/a* for not applicable or *unknown* if you do not know it.
        - You can find it in the Admin area of WordPress. Ex: under Tools → Site Health, and then Info.
      placeholder: "ex. 8.5"
    validations:
      required: false
