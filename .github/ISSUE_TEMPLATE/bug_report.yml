name: 🐛 Bug report
description: Report a reproducible bug in OpenPorte
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        - For a **security vulnerability**, please don't use this form — see [SECURITY.md](https://github.com/jcberthon/openporte/security/policy) instead.
        - If you're **not sure** whether this is a bug or just need help, please ask on the [support forum](https://wordpress.org/support/plugin/openporte/) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenPorte version
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: false
