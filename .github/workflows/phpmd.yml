# Runs PHPMD (https://phpmd.org/) — complexity, dead code and design smells, as
# configured in phpmd.xml.dist. Findings are advisory: they are uploaded as SARIF
# to the Security tab for the maintainer to judge, and do not fail the build.
# See docs/agents/static-analysis.md.
#
# The scan itself is delegated to bin/lint/phpmd.sh, the same entry point
# developers use via `npm run lint:phpmd`, so local and CI results match.

name: PHPMD

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '25 14 * * 4'

permissions:
  contents: read

jobs:
  PHPMD:
    name: Run PHPMD scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same PHP version as phpcs.yml, so both analysers see the same language
      # semantics. PHPMD itself comes from composer.lock rather than setup-php's
      # `tools:`, so CI and developers run an identical version.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPMD
        run: bash bin/lint/phpmd.sh sarif phpmd-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          sarif_file: phpmd-results.sarif
          wait-for-processing: true
